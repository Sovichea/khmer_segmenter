name: Python package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - run: python scripts/evaluate_real_world_typos.py
      - run: python scripts/validate_findings.py --bundled-only
      - run: python -m khmer_segmenter --help

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py dist/*
      - run: python scripts/validate_findings.py --bundled-only

  rust-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: python scripts/build_dictionary_kdict.py
      - run: cargo test --manifest-path port/rust/Cargo.toml --lib
      - run: >-
          cargo check --manifest-path port/rust/Cargo.toml
          --target wasm32-unknown-unknown
          --no-default-features --features wasm
