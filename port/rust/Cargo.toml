[package]
name = "khmer_segmenter"
version = "0.2.0"
edition = "2021"
description = "Khmer Viterbi segmentation and deterministic spelling suggestions"
license-file = "../../LICENSE"
repository = "https://github.com/Sovichea/khmer_segmenter"
default-run = "khmer_segmenter"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cli"]
cli = ["dep:rayon"]
wasm = ["dep:serde", "dep:serde-wasm-bindgen", "dep:wasm-bindgen"]

[dependencies]
rayon = { version = "1.10.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"

[[bin]]
name = "khmer_segmenter"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "debug_dict"
path = "src/bin/debug_dict.rs"
required-features = ["cli"]

[[bin]]
name = "mine_typos"
path = "src/bin/mine_typos.rs"
required-features = ["cli"]

[[bin]]
name = "mine_community_words"
path = "src/bin/mine_community_words.rs"
required-features = ["cli"]
